planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      use_sim_time: false
      allow_unknown: true

controller_server:
  ros__parameters:
    current_goal_checker: goal_checker
    goal_checker_plugins: ["goal_checker"] # ← 추가
    progress_checker_plugin: "progress_checker" # ← 추가
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10 # 기본 0.5 -> 완화
      movement_time_allowance: 20.0 # 기본 10.0 -> 완화
    odom_topic: /odom
    controller_frequency: 10.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.26
      max_speed_xy: 0.26 # ← 추가
      min_speed_xy: 0.0 # ← 추가
      max_vel_theta: 1.0
      min_speed_theta: 0.0 # ← 이름 교정
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 0 # ← 비홀로노믹
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05 # ← 이걸 넣고
      angular_granularity: 0.025
      transform_tolerance: 0.5
      critics:
        [
          "RotateToGoal",
          "ObstacleFootprint",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      GoalDist.scale: 1.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      ObstacleFootprint.scale: 0.015

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      width: 4
      height: 4
      resolution: 0.07
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/projected_map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /Laser_map
          max_obstacle_height: 0.4
          min_obstacle_height: 0.12
          clearing: true
          marking: true
          data_type: "PointCloud2"
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.18
      update_frequency: 10.0
      publish_frequency: 10.0
      width: 3
      height: 3
      resolution: 0.07
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /cloud_registered
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          expected_update_rate: 10.0 # 센서 Hz에 맞춰
          observation_persistence: 0.0 # 잔상 제거(프레임당 반영)
          clearing: true
          marking: true
          data_type: "PointCloud2"
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.08

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"

